version: '3'
services:
  nginx:
      image: nginx:alpine
      ports:
        - "8080:80"
      volumes:
        - .:/var/www/html
        - ./Docker/nginx/default.conf:/etc/nginx/conf.d/default.conf
      depends_on:
        - php
      networks:
        - sns_network

  php:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: php_container
    env_file:
      - .env
    environment:
      - MAIL_USER=${MAIL_USER}
      - MAIL_PASSWORD=${MAIL_PASSWORD}
    ports:
      - 3001:9000
    working_dir: /var/www/html
    volumes:
      - ./:/var/www/html
    networks:
      - sns_network
    depends_on:
      - db
  db:
    image: mysql:latest
    container_name: db_container
    env_file:
      - .env
    ports:
      - "3006:3306"
    hostname: "mysql"
    volumes:
      - db_data:/var/lib/mysql
      - ./Docker/db/my.cnf:/etc/mysql/my.cnf
    networks:
      - sns_network


